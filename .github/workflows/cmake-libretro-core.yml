name: CMake-Libretro-Core

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: Build libretro core (linux-${{ matrix.arch }})

    steps:
    - uses: actions/checkout@v4

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: libretro-linux-${{ matrix.arch }}

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          gcc \
          libogg-dev \
          libsdl3-dev \
          libsdl3-ttf-dev \
          libsdl3-image-dev \
          libsdl3-mixer-dev \
          libzip-dev \
          libvorbis-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ../src -DLIBRETRO=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make hypseus_singe_libretro -j$(nproc)

    - name: Rename artifact
      run: cp build/hypseus_singe_libretro.so hypseus_singe_libretro-linux-${{ matrix.arch }}.so

    - name: Upload artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: hypseus_singe_libretro-linux-${{ matrix.arch }}
        path: hypseus_singe_libretro-linux-${{ matrix.arch }}.so

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: hypseus_singe_libretro-linux-${{ matrix.arch }}.so

  build-windows:
    runs-on: windows-latest
    name: Build libretro core (windows-x86_64)

    steps:
    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-SDL3
          mingw-w64-x86_64-SDL3_ttf
          mingw-w64-x86_64-SDL3_image
          mingw-w64-x86_64-SDL3_mixer
          mingw-w64-x86_64-libvorbis
          mingw-w64-x86_64-libogg
          mingw-w64-x86_64-libzip
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-ccache
          make
          autoconf
          automake
          libtool

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: libretro-windows-x86_64
        variant: ccache

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake ../src -DLIBRETRO=ON -G "MSYS Makefiles" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make hypseus_singe_libretro -j$(nproc)

    - name: Rename artifact
      shell: msys2 {0}
      run: cp build/hypseus_singe_libretro.dll hypseus_singe_libretro-windows-x86_64.dll

    - name: Upload artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: hypseus_singe_libretro-windows-x86_64
        path: hypseus_singe_libretro-windows-x86_64.dll

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: hypseus_singe_libretro-windows-x86_64.dll

  build-macos:
    runs-on: macos-latest
    name: Build libretro core (macOS-arm64)

    steps:
    - uses: actions/checkout@v4

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: libretro-macos-arm64

    - name: Install Dependencies
      run: |
        brew install \
          cmake \
          autoconf \
          automake \
          libtool \
          pkg-config \
          sdl3 \
          sdl3_ttf \
          sdl3_image \
          sdl3_mixer \
          libvorbis \
          libogg \
          libzip

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ../src -DLIBRETRO=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make hypseus_singe_libretro -j$(sysctl -n hw.logicalcpu)

    - name: Rename artifact
      run: cp build/hypseus_singe_libretro.dylib hypseus_singe_libretro-macOS-arm64.dylib

    - name: Upload artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: hypseus_singe_libretro-macOS-arm64
        path: hypseus_singe_libretro-macOS-arm64.dylib

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: hypseus_singe_libretro-macOS-arm64.dylib
